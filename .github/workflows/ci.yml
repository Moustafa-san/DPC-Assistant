name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & ESLint Check
        run: npm run lint

      - name: TypeScript Strict Static Typecheck
        run: npx tsc --noEmit

      - name: Unit, Integration & Acceptance Test Suite (Vitest)
        run: npm test

      - name: Live PostgreSQL 16 Multi-Tenant RLS Penetration Suite
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20261106000000_init_schema_and_rls.sql
          psql -h localhost -U postgres -d postgres -f supabase/tests/rls_security_live.sql

      - name: Production Build (Next.js App Router)
        run: npm run build
